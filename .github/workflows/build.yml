name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One run per branch/PR: a new push cancels the outdated run instead of burning minutes on it.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (engine, catalog, UI scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Unit tests
        run: dotnet test tests/AITweaker.Core.Tests -c Release
      - name: Demo data matches the catalog
        run: |
          python3 tools/gen-mock-data.py
          git diff --exit-code -- src/AITweaker.App/wwwroot/js/mock-data.js
      - name: UI scripts parse
        run: for f in src/AITweaker.App/wwwroot/js/*.js; do node --check "$f"; done

  windows:
    name: Windows build (AITweaker.exe)
    runs-on: windows-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Unit tests on Windows
        run: dotnet test tests/AITweaker.Core.Tests -c Release
      - name: Publish single-file exe
        run: dotnet publish src/AITweaker.App/AITweaker.App.csproj -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: AITweaker-win-x64
          path: publish/AITweaker.exe
          if-no-files-found: error
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AI Tweaker ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: publish/AITweaker.exe
          make_latest: true
